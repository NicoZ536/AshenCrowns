[dependencies]
ashen_core.workspace = true
ashen_sim.workspace = true
ashen_engine.workspace = true
glam.workspace = true
egui.workspace = true
serde.workspace = true
ron.workspace = true
image.workspace = true
log.workspace = true
env_logger.workspace = true
