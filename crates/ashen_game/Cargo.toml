[package]
name = "ashen_game"
description = "ASHEN CROWNS – The Age of the Fallen (game executable)"
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "ashen_crowns"

[[bin]]
name = "ashen_crowns"
path = "src/main.rs"

[features]
default = ["audio"]
